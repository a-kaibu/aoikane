name: Pure Go
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [windows/amd64, linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - name: Cross-compile release binary
        env:
          TARGET: ${{ matrix.target }}
        run: GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build -trimpath -o "$RUNNER_TEMP/aoikane" ./cmd/aoikane
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: go test ./... -timeout=20m
      - run: go build -trimpath ./cmd/aoikane
      - name: Verify original WAVs on ARM64
        if: runner.arch == 'ARM64'
        env:
          AOIKANE_UNIT_COEFFICIENT_REFERENCE_AUDIT: '1'
          AOIKANE_LEADING_LITERAL_ZERO_DECIMAL_REFERENCE_AUDIT: '1'
          AOIKANE_WAV_FAILURE_DIR: ${{ runner.temp }}/wav-failures
        run: |
          uname -m
          go env GOOS GOARCH CGO_ENABLED
          go test ./internal/portable -run '^(TestUnitCoefficientReferenceWAV|TestLeadingLiteralZeroDecimalReferenceWAV)$' -count=1 -v -timeout=75m
      - name: Save differing WAVs
        if: failure() && runner.arch == 'ARM64'
        uses: actions/upload-artifact@v4
        with:
          name: arm64-wav-failures
          path: ${{ runner.temp }}/wav-failures
          if-no-files-found: ignore
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: GOEXPERIMENT=simd GOOS=js GOARCH=wasm go build -trimpath -o "${{ runner.temp }}/aoikane.wasm" ./cmd/aoikane-wasm
      - run: go test ./internal/assetfs
