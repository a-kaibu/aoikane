name: Original WAV on ARM64

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Original WAV reference set
        type: choice
        required: true
        default: signed-streams
        options:
          - signed-streams
          - mixed-unit-zero-tail
          - unit-zero-table-boundary
          - fraction-script-boundary
          - rei-unit-point
          - counter-word
          - mixed-zero-series

permissions:
  contents: read

jobs:
  original-wave:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - name: Compare complete original WAVs
        env:
          AOIKANE_WAV_FAILURE_DIR: ${{ runner.temp }}/wav-failures
          AOIKANE_SIGN_HYPHEN_REFERENCE_AUDIT: ${{ inputs.suite == 'signed-streams' && '1' || '0' }}
          AOIKANE_MIXED_UNIT_ZERO_TAIL_REFERENCE_AUDIT: ${{ inputs.suite == 'mixed-unit-zero-tail' && '1' || '0' }}
          AOIKANE_UNIT_ZERO_TABLE_BOUNDARY_REFERENCE_AUDIT: ${{ inputs.suite == 'unit-zero-table-boundary' && '1' || '0' }}
          AOIKANE_FRACTION_SCRIPT_BOUNDARY_REFERENCE_AUDIT: ${{ inputs.suite == 'fraction-script-boundary' && '1' || '0' }}
          AOIKANE_REI_UNIT_POINT_REFERENCE_AUDIT: ${{ inputs.suite == 'rei-unit-point' && '1' || '0' }}
          AOIKANE_COUNTER_WORD_REFERENCE_AUDIT: ${{ inputs.suite == 'counter-word' && '1' || '0' }}
          AOIKANE_MIXED_ZERO_SERIES_REFERENCE_AUDIT: ${{ inputs.suite == 'mixed-zero-series' && '1' || '0' }}
        run: |
          uname -m
          go env GOOS GOARCH CGO_ENABLED
          go test ./internal/portable -run '^(TestSignHyphenReferenceWAV|TestMixedUnitZeroTailReferenceWAV|TestUnitZeroTableBoundaryReferenceWAV|TestFractionScriptBoundaryReferenceWAV|TestReiUnitPointReferenceWAV|TestCounterWordReferenceWAV|TestMixedZeroSeriesReferenceWAV)$' -count=1 -v -timeout=65m
      - name: Save differing WAVs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-original-wav-failures
          path: ${{ runner.temp }}/wav-failures
          if-no-files-found: ignore
