name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Install WebAssembly compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build static site
        run: |
          ./scripts/build-web.sh
          test -s dist/kernels.wasm
          node scripts/test-web-kernels.cjs dist/kernels.wasm
          GOROOT="$(go env GOROOT)" GOEXPERIMENT=simd GOOS=js GOARCH=wasm go test -exec="node $PWD/scripts/go-web-kernels-exec.cjs" ./internal/onnx ./internal/dsp -run '^(TestWebKernel|TestWasmSIMD|TestFastConv|TestAdaptiveGather)' -count=1
      - name: Verify browser workers and fallbacks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/web-test/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/web-test" --ignore-scripts --no-audit --no-fund playwright@1.65.0
          "$RUNNER_TEMP/web-test/node_modules/.bin/playwright" install --with-deps chromium
          node scripts/test-web-browser.cjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
