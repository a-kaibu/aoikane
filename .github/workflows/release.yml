name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  web:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Install WebAssembly compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build and test browser distribution
        run: |
          ./scripts/build-web.sh
          test -s dist/kernels.wasm
          node scripts/test-web-kernels.cjs dist/kernels.wasm
          python3 scripts/test_package_web.py
          python3 scripts/package-web.py --site dist --output "$RUNNER_TEMP/web-release" --version "$GITHUB_REF_NAME"
      - name: Attach WASM and complete browser bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/web-release/"* --clobber
