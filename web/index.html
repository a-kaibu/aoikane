<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aoikane Web — 日本語音声合成</title>
  <meta name="description" content="ブラウザ内で動作する日本語音声合成。入力したテキストは外部へ送信されません。">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./wasm_exec.js"></script>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Text to Speech</p>
      <h1>Aoikane</h1>
      <p class="lead">
        ブラウザ内で動く日本語音声合成です。
        入力したテキストはサーバーへ送信されません。
      </p>
    </header>

    <section class="card" aria-labelledby="input-heading">
      <h2 id="input-heading" class="visually-hidden">入力</h2>
      <label class="field" for="text">
        <span>テキスト</span>
        <textarea id="text" rows="5" maxlength="2000" spellcheck="false">こんにちは。今日はいい天気ですね。</textarea>
      </label>

      <div class="grid">
        <label class="field" for="voice">
          <span>声</span>
          <select id="voice">
            <option value="aoi" selected>葵（標準）</option>
            <option value="akane">茜（関西）</option>
          </select>
        </label>
        <label class="field" for="rate">
          <span>速度 <output id="rate-value" for="rate">1.00</output></span>
          <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1">
        </label>
        <label class="field" for="pitch">
          <span>高さ <output id="pitch-value" for="pitch">1.00</output></span>
          <input id="pitch" type="range" min="0.5" max="2" step="0.05" value="1">
        </label>
        <label class="field" for="volume">
          <span>音量 <output id="volume-value" for="volume">1.00</output></span>
          <input id="volume" type="range" min="0" max="2" step="0.05" value="1">
        </label>
        <label class="field" for="emphasis">
          <span>抑揚 <output id="emphasis-value" for="emphasis">1.00</output></span>
          <input id="emphasis" type="range" min="0" max="2" step="0.05" value="1">
        </label>
      </div>

      <div class="actions">
        <button id="synthesize" type="button" disabled>音声を合成</button>
        <p id="model-info" class="note"></p>
      </div>

      <div class="status-box">
        <p id="status" role="status" aria-live="polite">WASM を読み込み中です…</p>
        <progress id="progress" max="1" value="0" hidden></progress>
      </div>
    </section>

    <section id="result" class="card" aria-labelledby="result-heading" hidden>
      <div class="result-head">
        <h2 id="result-heading">合成結果</h2>
        <a id="download" class="download" download="aoikane.wav">WAV をダウンロード</a>
      </div>
      <audio id="audio" controls preload="metadata"></audio>
      <ol id="cues" class="cues" aria-label="文ごとの再生位置"></ol>
    </section>

    <footer class="footer">
      <p>
        初回の合成時にモデルを読み込みます。読み込んだモデルはブラウザのキャッシュに保存されます。
      </p>
      <p id="version" class="version"></p>
    </footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
