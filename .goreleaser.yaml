version: 2
project_name: aoikane
before:
  hooks: [go mod verify]
builds:
  - main: ./cmd/aoikane
    binary: aoikane
    env: [CGO_ENABLED=0]
    flags: [-trimpath, '-tags=aoikane_compact']
    ldflags: ['-s -w -X main.version={{ .Version }}']
    targets: [windows_amd64, linux_amd64, linux_arm64, darwin_amd64, darwin_arm64]
archives:
  - formats: [tar.zst]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: assets/compact/OpenZL-LICENSE.txt
        strip_parent: true
checksum:
  name_template: checksums.txt
changelog:
  disable: true
release:
  draft: true
